<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hamed & Mahsa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Background -->

<div class="background">

<div class="overlay"></div>

<div class="particles"></div>

</div>



<!-- Main -->

<div class="wrapper">



<div class="intro">

<h2 class="small-title">

Wedding Invitation

</h2>


<h1 class="main-title">

Hamed

<span>&</span>

Mahsa

</h1>


<p class="subtitle">

Together with their families

invite you to celebrate

their wedding

</p>

</div>



<!-- Envelope -->

<div class="scene">



<div class="envelope" id="envelope" onclick="openEnvelope()">



<div class="shadow"></div>



<div class="back"></div>



<div class="letter">

<div class="letter-content">

<div class="line"></div>
<p class="touch">Touch To Open</p>

</div>

</div>



<div class="front"></div>



<div class="flap"></div>



<div class="wax">

<div class="wax-text">

H

♥

M

</div>

</div>



</div>

</div>



<div class="hint">

Tap anywhere on the invitation

</div>



</div>



<!-- Loading -->

<div class="loading">

<div class="loader"></div>

</div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

<script src="script.js"></script>
<script>

function createHearts(){

for(let i=0;i<35;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="♥";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=
(5+Math.random()*8)+"s";

heart.style.animationDelay=
Math.random()*8+"s";


document.body.appendChild(heart);

}

}


createHearts();


</script>
</body>

</html>
